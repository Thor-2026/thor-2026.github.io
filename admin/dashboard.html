<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<!-- 
  FORCE BROWSER CACHE RELOAD ON BACK BUTTON
  This script executes immediately to force a reload if the page is pulled from browser memory/bfcache
-->
<script>
    window.addEventListener('pageshow', function (event) {
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
            window.location.reload();
        }
    });
</script>

<title>OpsVision Display CMS</title>

<!-- System Interface Theme Framework Layers -->
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/team.css">
<link rel="stylesheet" href="css/permissions.css">
<link rel="stylesheet" href="css/activity.css">

</head>

<body>

<!-- Persistent Top-Right Profile Bar -->
<div class="user-profile-widget" id="userProfileWidget">
    <button class="profile-avatar-btn" id="profileAvatarBtn" title="Account Menu">
        <span class="avatar-icon">👤</span>
    </button>
    
    <div class="profile-dropdown" id="profileDropdown">
        <div class="profile-header">
            <div id="dropdownUserName" class="profile-name">User</div>
            <div id="dropdownUserRole" class="profile-role">Staff</div>
        </div>
        <hr class="profile-divider">
        <button id="logoutBtn" class="dropdown-logout-btn">
            🚪 Logout
        </button>
    </div>
</div>

<div class="sidebar">

    <h2>OpsVision Display</h2>

    <div class="menu-container">
        <button class="menu active" data-page="dashboard">
            📊 Dashboard
        </button>

        <button class="menu" data-page="labels">
            📋 Label Inventory
        </button>

        <button class="menu" data-page="schedule">
            📄 Schedule
        </button>

        <button class="menu" data-page="announcements">
            📢 Announcements
        </button>

        <button class="menu" data-page="ticker">
            📰 Ticker
        </button>

        <button class="menu" data-page="branding">
            🖼 Branding
        </button>

        <button class="menu" data-page="weather">
            🌤 Weather
        </button>

        <button class="menu" data-page="settings">
            ⚙ Settings
        </button>

        <button class="menu" data-page="team">
            👥 Team
        </button>

        <button class="menu" data-page="permissions">
            🔐 Permissions
        </button>

        <button class="menu" data-page="activity">
            📜 Activity Log
        </button>

        <!-- Embedded Sidebar Logout Button (Placed inside menu flow) -->
        <div class="sidebar-logout-container">
            <button id="sidebarLogoutBtn" class="sidebar-logout-btn">
                🚪 Logout
            </button>
        </div>
    </div>

</div>

<div class="content">

    <div id="pageContent">
        Loading...
    </div>

</div>

<!-- Core System Application Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="auth/auth.js"></script>
<script src="js/activity-helper.js"></script>
<script src="js/dashboard.js"></script>

<!-- Content Domain Components -->
<script src="js/labels.js"></script>
<script src="js/schedule.js"></script>
<script src="js/announcements.js"></script>
<script src="js/branding.js"></script>
<script src="js/weather.js"></script>
<script src="js/settings.js"></script>
<script src="js/ticker.js"></script>

<!-- Management Framework Control Logics -->
<script src="team/team.js"></script>
<script src="team/permissions.js"></script>
<script src="team/activity.js"></script>

<!-- Connect Sidebar Logout Button Listener -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const sidebarLogoutBtn = document.getElementById("sidebarLogoutBtn");
        if (sidebarLogoutBtn) {
            sidebarLogoutBtn.addEventListener("click", () => {
                if (typeof handleLogout === "function") {
                    handleLogout();
                } else {
                    const topLogoutBtn = document.getElementById("logoutBtn");
                    if (topLogoutBtn) topLogoutBtn.click();
                }
            });
        }
    });
</script>

</body>

</html>
